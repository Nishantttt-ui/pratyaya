name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # fastembed defaults to a temp directory, which a cache action cannot see.
  # Pinning it inside the workspace makes the model cacheable between runs.
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the virtual environment
        # Not `uv pip install --system`: the runner's system interpreter is
        # externally managed (PEP 668) and refuses it. Putting the venv's bin
        # on PATH makes python, pytest and ruff resolve to it in later steps,
        # since each `run` gets a fresh shell and an activate would not persist.
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-bge-small-en-v1.5-v1

      - name: Lint
        run: ruff check backend ml eval scripts

      - name: Train the model
        # Artifacts are git-ignored by design: they are build outputs, not
        # source. Producing them here also verifies the training pipeline runs
        # end to end on a clean machine.
        run: python scripts/train.py

      - name: Test
        run: pytest --cov=backend/app --cov=ml --cov-report=term
        env:
          JWT_SECRET: ci-only-secret-not-used-for-anything-else
          # Deliberately unreachable: the pgvector integration tests skip
          # cleanly rather than failing when no external database is configured.
          DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
          DEMO_UNDERWRITER_PASSWORD: ci-underwriter-pw
          DEMO_APPLICANT_PASSWORD: ci-applicant-pw

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
