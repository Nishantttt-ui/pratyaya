[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pratyaya"
version = "0.1.0"
description = "Explainable, fairness-audited credit risk assessment for thin-file and new-to-credit borrowers"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # --- API layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # --- Persistence ---
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    # --- Security ---
    "pyjwt>=2.10",
    # bcrypt directly, not passlib: passlib is unmaintained and its backend
    # probe raises on bcrypt >= 4.1.
    "bcrypt>=4.1",
    "slowapi>=0.1.9",
    # --- ML / decisioning ---
    # HistGradientBoosting (in scikit-learn) is used instead of LightGBM/XGBoost.
    # Both of those ship a native library that dynamically links libomp.dylib on
    # macOS, which is only present if the grader happens to have Homebrew. Using
    # scikit-learn keeps the project installable on a clean machine, and its
    # histogram-based booster handles NaN and categoricals natively - which
    # matters here, because for thin-file applicants missingness is informative.
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "shap>=0.46",
    "fairlearn>=0.11",
    "joblib>=1.4",
    # --- Retrieval / AI layer ---
    "fastembed>=0.4",
    "httpx>=0.27",
    # --- Observability ---
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "matplotlib>=3.9",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "eval"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database or network",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "ml", "eval"]
